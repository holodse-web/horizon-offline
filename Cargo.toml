[package]
name = "horizon-offline"
version = "0.8.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "Horizon Offline terminal launcher by RRM Network"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
ring = "0.17"
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
self-replace = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
